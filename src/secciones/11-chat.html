  <!-- Chat del staff: un canal por equipo y uno general -->
  <section id="chat" data-roles="asistencia acreditacion seguridad traslado coordinacion bienestar eventos">
    <div class="titulo-sec"><span class="n">00</span><h2>Chat del staff</h2></div>
    <p class="lead">Escríbele a tu equipo o a todo el staff. Los mensajes llegan al instante; si es importante, marca «🚨 Mandar como aviso»: le suena a todo el canal aunque tenga el teléfono bloqueado y cada persona toca «Recibido».</p>
    <div class="chat">
      <nav class="chat-canales" id="chatCanales" aria-label="Canales"></nav>
      <div class="chat-panel">
        <div class="chat-cab"><div><b id="chatTitulo">General</b><small id="chatSub">Todo el staff</small></div><span class="chip" id="chatEstado">Conectando…</span></div>
        <div class="chat-lista" id="chatLista" aria-live="polite"></div>
        <div class="chat-rapidos" id="chatRapidos"></div>
        <form class="chat-escribir" id="chatForm" autocomplete="off">
          <label class="chat-urgente" title="Lo puede mandar cualquiera: suena en el teléfono de todo el canal, aunque esté bloqueado, y cada persona toca «Recibido»"><input type="checkbox" id="chatUrgente"><span>🚨 Mandar como aviso</span></label>
          <input id="chatTexto" maxlength="600" placeholder="Escribe un mensaje…" aria-label="Mensaje" enterkeyhint="send">
          <button class="boton" type="submit" id="chatEnviar" aria-label="Enviar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-3-7z"/></svg></button>
        </form>
      </div>
    </div>
  </section>
